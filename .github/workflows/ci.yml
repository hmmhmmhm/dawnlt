name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  select-runner:
    uses: ./.github/workflows/select-local-runner.yml
    with:
      cloud-runner: ubuntu-latest
    secrets:
      status-token: ${{ secrets.LOCAL_RUNNER_STATUS_TOKEN }}

  verify:
    needs: select-runner
    runs-on: ${{ fromJSON(needs.select-runner.outputs.runner) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.33.4 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm --dir apps/dawnlight exec tsc --noEmit

      - name: Test
        run: pnpm --dir apps/dawnlight test --runInBand

      - name: Build
        run: pnpm build
